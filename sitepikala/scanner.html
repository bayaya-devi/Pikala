<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="scannerTitleV2">Pikala - Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/foundation.css">
  <link rel="stylesheet" href="user-space.css">
  <script src="assets/vendor/lucide.min.js" defer></script>
  <script src="assets/vendor/zxing-browser.min.js" defer></script>
  <script type="module" src="user-space.js"></script>
</head>
<body data-user-page="scanner">
  <div data-user-shell></div>
  <main class="user-main scanner-main">
    <header class="user-topbar"><div><p class="user-kicker" data-i18n="scannerSubtitleV2">Cadrez le QR code placé sur le vélo.</p><h1 data-i18n="scannerHeadingV2">Scanner un vélo</h1></div><div data-layout-actions></div></header>
    <section class="scanner-layout">
      <div class="camera-surface"><video data-scanner-video muted playsinline></video><div class="scan-guide"><span></span></div><div class="camera-placeholder" data-camera-placeholder><i data-lucide="scan-line"></i></div></div>
      <div class="surface scanner-controls">
        <button class="button secondary" type="button" data-camera-toggle><i data-lucide="camera"></i><span data-i18n="scannerCameraStart">Ouvrir la caméra</span></button>
        <div class="inline-message" data-scanner-message role="status" aria-live="polite"></div>
        <form data-ride-form novalidate>
          <label><span data-i18n="scannerManualLabel">Code du vélo</span><input name="bikeCode" autocomplete="off" maxlength="300" required data-i18n-attr="placeholder:scannerManualPlaceholder" placeholder="Ex. PIKALA-001"></label>
          <button class="button primary" type="submit"><i data-lucide="unlock"></i><span data-i18n="scannerUnlock">Déverrouiller</span></button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
