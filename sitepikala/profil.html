<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="profileTitle">Pikala - Profil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="user-space.css">
  <link rel="stylesheet" href="assets/css/foundation.css">
  <script type="module" src="user-space.js"></script>
</head>
<body data-user-page="profile">
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="index.html"><img src="logo.jpeg" alt="Pikala">Pikala</a>
      <nav class="nav"><a href="dashboard.html">Tableau de bord</a><a href="stations.html">Stations</a><a href="scanner.html">Scanner</a><a class="active" href="profil.html">Profil</a><a href="support.html">Support</a></nav>
    </aside>
    <main class="content">
      <div class="topbar"><div><p class="eyebrow" data-i18n="profileTitle">Profil</p><h1 data-i18n="profileHeading">Votre profil.</h1></div><a class="button ghost" href="index.html" data-logout data-i18n="commonLogout">Se déconnecter</a></div>
      <section class="grid two">
        <article class="panel">
          <h2 data-i18n="profileAccount">Compte</h2>
          <div class="profile-list">
            <div><strong data-i18n="nameLabel">Nom</strong><span data-profile-name>Chargement...</span></div>
            <div><strong data-i18n="emailLabel">E-mail</strong><span data-profile-email>Chargement...</span></div>
            <div><strong data-i18n="phoneLabel">Téléphone</strong><span data-profile-phone>Chargement...</span></div>
          </div>
        </article>
        <article class="panel">
          <h2 data-i18n="profileSubscription">Abonnement</h2>
          <p class="muted" data-profile-subscription>Chargement...</p>
          <a class="button primary" href="abonnement.html" data-i18n="manageSubscription">Gérer l'abonnement</a>
        </article>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Navigation rapide utilisateur">
    <a href="dashboard.html" data-bottom-nav="dashboard"><span aria-hidden="true">🏠</span><em>Accueil</em></a>
    <a href="stations.html" data-bottom-nav="stations"><span aria-hidden="true">📍</span><em>Stations</em></a>
    <a href="scanner.html" data-bottom-nav="scanner"><span aria-hidden="true">🔳</span><em>Scanner</em></a>
    <a href="profil.html" data-bottom-nav="profile"><span aria-hidden="true">⚙️</span><em>Profil</em></a>
    <a href="support.html" data-bottom-nav="support"><span aria-hidden="true">💬</span><em>Support</em></a>
  </nav>

</html>
