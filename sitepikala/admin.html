<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title data-i18n="adminControlCenter">Pikala Control Center</title>
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/css/foundation.css">
  <link rel="stylesheet" href="admin.css">
  <script src="assets/vendor/leaflet/leaflet.js" defer></script>
  <script src="assets/vendor/lucide.min.js" defer></script>
  <script type="module" src="admin.js"></script>
  <meta name="theme-color" content="#245c11">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/pikala-192.png" type="image/png">
  <script type="module" src="/assets/js/pwa.js"></script>
</head>
<body data-user-page="admin">
  <div class="admin-shell">
    <aside class="admin-sidebar" data-admin-sidebar>
      <div class="admin-brand"><img src="logo.jpeg" alt="Pikala"><div><strong>Pikala</strong><span data-i18n="adminControlCenter">Control Center</span></div></div>
      <nav class="admin-nav" aria-label="Administration" data-admin-nav></nav>
      <div class="admin-account"><span data-admin-initials>PK</span><div><strong data-admin-name>Administration</strong><small data-admin-email></small></div><a href="dashboard.html" class="icon-button" title="Retour au site"><i data-lucide="external-link"></i></a></div>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="icon-button admin-menu-button" type="button" data-admin-menu aria-label="Menu"><i data-lucide="menu"></i></button>
        <div><p class="admin-kicker" data-i18n="adminControlCenter">Pikala Control Center</p><h1 data-admin-heading>Dashboard</h1></div>
        <div class="admin-top-actions" data-layout-actions></div>
      </header>
      <section class="admin-view" data-admin-view aria-live="polite" aria-busy="true">
        <div class="admin-loading"><span class="pk-loader"></span><p data-i18n="adminLoading">Chargement des données...</p></div>
      </section>
    </main>
  </div>
  <div class="admin-backdrop" data-admin-backdrop></div>
  <dialog class="admin-dialog" data-admin-dialog aria-labelledby="admin-dialog-title">
    <form method="dialog" class="admin-dialog-head"><h2 id="admin-dialog-title" data-dialog-title></h2><button class="icon-button" value="cancel" aria-label="Fermer"><i data-lucide="x"></i></button></form>
    <div data-dialog-content></div>
  </dialog>
  <dialog class="admin-confirm" data-admin-confirm aria-labelledby="admin-confirm-title">
    <h2 id="admin-confirm-title" data-i18n="adminConfirmTitle">Confirmer l'action</h2><p data-confirm-message></p>
    <form method="dialog" class="admin-confirm-actions"><button class="button secondary" value="cancel" data-i18n="adminCancel">Annuler</button><button class="button danger" value="confirm" data-i18n="adminConfirm">Confirmer</button></form>
  </dialog>
</body>
</html>
