<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
  <title data-i18n="fieldTitle">Pikala Terrain</title><meta name="theme-color" content="#245c11">
  <link rel="stylesheet" href="assets/css/foundation.css"><link rel="stylesheet" href="terrain.css"><link rel="stylesheet" href="terrain-admin.css"><link rel="manifest" href="/manifest.webmanifest">
  <script src="assets/vendor/zxing-browser.min.js" defer></script><script type="module" src="terrain.js"></script>
</head>
<body>
  <header class="field-header"><a class="pk-button pk-button--ghost" href="admin.html" data-i18n="fieldBack">Control Center</a><img src="logo.jpeg" alt="Pikala"><select class="pk-select" data-locale aria-label="Langue"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option><option value="ar">AR</option></select></header>
  <main class="field-shell">
    <section class="field-intro"><div><p>Pikala Operations</p><h1 data-i18n="fieldHeading">Missions terrain</h1><span data-i18n="fieldSubtitle">Scannez chaque étape avant de déplacer un vélo.</span></div><button class="pk-button pk-button--ghost" type="button" data-refresh data-i18n="fieldRefresh">Actualiser</button></section>
    <section class="field-stats" data-stats aria-live="polite"></section>
    <section class="field-admin-tools" data-admin-tools hidden><div><strong data-i18n="fieldOperations">Pilotage des opérations</strong><span data-i18n="fieldOperationsHint">Les suggestions reposent uniquement sur la disponibilité D1.</span></div><div class="field-actions"><button class="pk-button pk-button--ghost" type="button" data-new-task data-i18n="fieldNewTask">Créer une mission</button><button class="pk-button pk-button--primary" type="button" data-generate data-i18n="fieldGenerate">Analyser le réseau</button></div></section>
    <section class="field-suggestions" data-suggestions hidden></section>
    <nav class="field-tabs" aria-label="Terrain"><button type="button" class="is-active" data-tab="missions" data-i18n="fieldMissions">Missions</button><button type="button" data-tab="active" data-i18n="fieldActive">En cours</button><button type="button" data-tab="custody" data-i18n="fieldCustody">Vélos pris en charge</button></nav>
    <section data-content aria-live="polite" aria-busy="true"><div class="pk-state"><span class="pk-loader"></span><p data-i18n="fieldLoading">Chargement...</p></div></section>
  </main>
  <dialog class="field-sheet" data-task-dialog><div class="sheet-head"><h2 data-task-title></h2><button class="pk-button pk-button--icon" type="button" data-close aria-label="Fermer">×</button></div><div data-task-body></div></dialog>
  <dialog class="field-scanner" data-scanner-dialog><div class="sheet-head"><h2 data-i18n="fieldScan">Scanner</h2><button class="pk-button pk-button--icon" type="button" data-scan-close aria-label="Fermer">×</button></div><video data-video muted playsinline></video><form class="field-form" data-scan-form><label class="pk-field"><span data-i18n="fieldCode">Code station ou quai</span><input class="pk-input" name="code" required maxlength="300" autocomplete="off"></label><label class="pk-field" data-bike-code hidden><span data-i18n="fieldBikeCode">Code vélo</span><input class="pk-input" name="bikeCode" maxlength="300" autocomplete="off"></label><button class="pk-button pk-button--primary" type="submit" data-i18n="fieldValidateScan">Valider le scan</button><p class="field-message" data-scan-message role="status"></p></form></dialog>
  <dialog class="field-sheet" data-admin-dialog><div class="sheet-head"><h2 data-i18n="fieldNewTask">Créer une mission</h2><button class="pk-button pk-button--icon" type="button" data-admin-close aria-label="Fermer">×</button></div><form class="field-form" data-admin-form><label class="pk-field"><span data-i18n="fieldType">Type</span><select class="pk-select" name="type"><option value="redistribution">redistribution</option><option value="bike_move">bike_move</option><option value="inspection">inspection</option><option value="maintenance">maintenance</option><option value="retrieval">retrieval</option><option value="station_check">station_check</option><option value="emergency">emergency</option><option value="other">other</option></select></label><label class="pk-field"><span data-i18n="fieldDescription">Description</span><textarea class="pk-textarea" name="description" required minlength="3" maxlength="1000"></textarea></label><div class="field-form-grid"><label class="pk-field"><span data-i18n="fieldAgentId">ID agent</span><input class="pk-input" name="agentId" type="number" min="1"></label><label class="pk-field"><span data-i18n="fieldPriority">Priorité</span><select class="pk-select" name="priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></label><label class="pk-field"><span data-i18n="fieldSourceId">ID station départ</span><input class="pk-input" name="sourceStationId" type="number" min="1"></label><label class="pk-field"><span data-i18n="fieldDestinationId">ID station arrivée</span><input class="pk-input" name="destinationStationId" type="number" min="1"></label></div><label class="pk-field"><span data-i18n="fieldBikeIds">IDs vélos, séparés par des virgules</span><input class="pk-input" name="bikeIds" inputmode="numeric"></label><label class="pk-field"><span data-i18n="fieldDeadline">Échéance</span><input class="pk-input" name="deadline" type="datetime-local"></label><button class="pk-button pk-button--primary" type="submit" data-i18n="fieldCreate">Créer</button></form></dialog>
</body>
</html>
